cargo-features = ["per-package-target"]

[workspace]
members = [
  "examples/hello_world",
  "examples/simple_display",
  "tests",
  "lib/embedtrait",
  "lib/hal",
  "lib/manifest",
  "lib/bsp",
  "lib/zermio/earlgrey",
  "lib/test-utils",
  "lib/test-utils-macros",
  "xtask",
]
resolver = "2"

[profile.release]
debug = true
opt-level = 2
lto = true

[profile.dev]
opt-level = 1

[profile.dev.package.'*']
opt-level = 2
