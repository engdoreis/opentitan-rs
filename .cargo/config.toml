[target.riscv32imc-unknown-none-elf]
runner = "tools/run_voyager.sh"
rustflags = [
  "-C", "link-arg=-T./lib/linker/link.ld",
  "-C", "link-arg=-L./lib/linker",
]

[env]
RISCV_RT_BASE_ISA = "rv32i"

[alias]
xtask = "run --package xtask --"
