cargo-features = ["per-package-target"]

[package]
name = "spi_host_tests"
version = "0.1.0"
edition = "2024"
forced-target = "riscv32imc-unknown-none-elf"

[dependencies]
embedded-hal = "1.0.0"
embedtrait = { version = "0.1.0", path = "../lib/embedtrait" }
hal = { version = "0.1.0", path = "../lib/hal" }
# manifest = { version = "0.1.0", path = "../lib/manifest" }
# panic-halt = "1.0.0"
riscv = { version = "0.16.0", features = ["critical-section-single-hart"] }
riscv-rt = "0.17.0"
zermio = { version = "0.1.0", path = "../lib/zermio/earlgrey" }
test-utils =  {path = "../lib/test-utils"}

[[test]]
name = "spi_smoketest"
path = "spi_host/smoketest.rs"
harness = false

[[test]]
name = "timer_smoketest"
path = "timer/smoketest.rs"
harness = false
