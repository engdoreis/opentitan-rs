cargo-features = ["per-package-target"]

[package]
name = "test-utils"
version = "0.1.0"
edition = "2024"

[dependencies]
embedded-hal = "1.0.0"
embedtrait = { version = "0.1.0", path = "../embedtrait" }
hal = { version = "0.1.0", path = "../hal" }
manifest = { version = "0.1.0", path = "../manifest" }
panic-halt = "1.0.0"
riscv = { version = "0.16.0", features = ["critical-section-single-hart"] }
riscv-rt = "0.17.0"
zermio = { version = "0.1.0", path = "../zermio/earlgrey" }
test-utils-macros = { version = "0.1.0", path = "../test-utils-macros" }

[lib]
test = false
